server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter Web SPA – alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Proxy zum Backend (Docker-internes Netzwerk)
    location /api/ {
        proxy_pass http://backend:8099/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # WebSocket-Proxy (kein Upgrade-Problem da Flutter Web WSS nutzt)
    location /ws/ {
        proxy_pass http://backend:8099/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health-Check
    location /health {
        proxy_pass http://backend:8099/health;
    }

    # Statische Assets cachen
    location ~* \.(js|css|png|jpg|gif|ico|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
