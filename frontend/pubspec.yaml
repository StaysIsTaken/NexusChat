name: nexuschat
description: NexusChat – Universelle KI-Chat-Applikation

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0

  # WebSocket
  web_socket_channel: ^2.4.0

  # State Management
  provider: ^6.1.2

  # Markdown Rendering
  flutter_markdown: ^0.7.3

  # Lokale Einstellungen (Backend-URL, Theme)
  shared_preferences: ^2.2.3

  # Datum/Zeit Formatierung
  intl: ^0.19.0

  # UUID für temporäre IDs
  uuid: ^4.4.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
