services:
  backend:
    build: ./backend
    ports:
      - "8099:8099"
    volumes:
      # SQLite-Daten persistent speichern
      - nexuschat-data:/app/data
      # Plugin-Verzeichnisse (ohne Image-Rebuild erweiterbar)
      - ./plugins/providers:/app/providers/custom
      - ./plugins/tools:/app/tools/custom
    environment:
      - CUSTOM_PROVIDERS_DIR=/app/providers/custom
      - CUSTOM_TOOLS_DIR=/app/tools/custom
    healthcheck:
      # python:slim hat kein curl – Healthcheck über die mitgelieferte stdlib
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexuschat-data:
    driver: local
